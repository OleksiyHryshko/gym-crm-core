# In-memory H2 so the container starts without external PostgreSQL
spring.datasource.url=jdbc:h2:mem:gym_crm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Matches the path where we copy initial_data.csv in the Dockerfile
data.file.path=/app/initial_data.csv